[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afstd"
version = "1.1.0"
description = "Reference implementation of AF-STD: randomized attributable fractions of adverse events from placebo-controlled trials"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
